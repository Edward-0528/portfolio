# Netlify configuration for Core Plus Support page and SPA routing

[build]
  # Build command
  command = "npm run build"
  
  # Directory that contains the deploy-ready HTML files and assets
  publish = "build"

  # Netlify Functions directory
  functions = "netlify/functions"

# Proxy /api/credly-badges → Netlify Function (avoids CORS in browser)
[[redirects]]
  from = "/api/credly-badges"
  to = "/.netlify/functions/credly-badges"
  status = 200

# Proxy /api/coreplus-live → Netlify Function (App Store rating + testimonials)
[[redirects]]
  from = "/api/coreplus-live"
  to = "/.netlify/functions/coreplus-live"
  status = 200

# Redirect rules for Single Page Application
# This ensures all routes are handled by React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  
# Optional: Set custom headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Core+ screenshots are content-stable — cache them hard so the showcase
# section never re-downloads on repeat visits.
[[headers]]
  for = "/coreplus/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
